version: "3.8"

services:
  backend:
    build: .
    container_name: muchtodo-backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/muchtodo
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:6
    container_name: mongodb
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    restart: always

volumes:
  mongo_data:
