apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: muchtodo
  labels:
    app: mongodb
type: Opaque
# Values are base64 encoded:
#   echo -n 'admin'    | base64  →  YWRtaW4=
#   echo -n 'secret'   | base64  →  c2VjcmV0
#   echo -n 'muchtodo' | base64  →  bXVjaHRvZG8=
data:
  mongo-root-username: YWRtaW4=
  mongo-root-password: c2VjcmV0
  mongo-database: bXVjaHRvZG8=
