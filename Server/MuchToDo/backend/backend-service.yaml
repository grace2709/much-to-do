apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: muchtodo
  labels:
    app: muchtodo-backend
spec:
  selector:
    app: muchtodo-backend
  ports:
    - protocol: TCP
      port: 80          # Service port (cluster internal)
      targetPort: 8080  # Container port
      nodePort: 30080   # Accessible on host via Vagrant port forward
  type: NodePort
