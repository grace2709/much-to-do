apiVersion: apps/v1
kind: Deployment
metadata:
  name: muchtodo-backend
  namespace: muchtodo
  labels:
    app: muchtodo-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: muchtodo-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: muchtodo-backend
    spec:
      containers:
        - name: muchtodo-backend
          image: muchtodo-api:latest
          imagePullPolicy: Never   # Use local image built into Kind
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-configmap
                  key: PORT
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: backend-configmap
                  key: APP_ENV
            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: backend-configmap
                  key: MONGO_DB
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: mongo-uri
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
